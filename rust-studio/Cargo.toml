[workspace]
resolver = "2"
members = [
    "crates/core-model",
    "crates/physics-sim",
    "crates/physics-wasm",
    "crates/mcp-server",
    "crates/studio-server",
    "crates/android-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
